[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "0.3.0"
description = "Adaptive security intelligence, policy optimization, and secure transfer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.3",
  "gymnasium>=0.29",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psutil>=6.0",
  "cryptography>=43.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
vision = [
  "pillow>=10.4",
  "open_clip_torch>=2.26,<3",
]
hermes = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]
all = [
  "pillow>=10.4",
  "open_clip_torch>=2.26,<3",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.scripts]
aegisflow-hermes = "aegisflow.integrations.hermes_mcp:main"

[tool.setuptools.packages.find]
include = ["aegisflow*", "backend*"]
