name: AegisFlow CI

on:
  pull_request:
    paths:
      - "aegisflow/context/**"
      - "aegisflow/security/**"
      - "aegisflow/service/**"
      - "aegisflow/integrations/**"
      - "aegisflow/evaluation/evaluate_content_intelligence.py"
      - "backend/**"
      - "frontend/**"
      - "tests/test_secure_transfer.py"
      - "tests/test_document_extraction.py"
      - "tests/test_hermes_integration.py"
      - "requirements.txt"
      - "requirements-vision.txt"
      - "requirements-hermes.txt"
      - ".github/workflows/secure-transfer-ci.yml"
  push:
    branches:
      - feature/adaptive-secure-transfer

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             cryptography             httpx             pypdf             python-docx             openpyxl             python-pptx             "mcp>=2,<3"
      - name: Run core deployment tests
        run: |
          python -m unittest             tests.test_secure_transfer             tests.test_document_extraction             tests.test_hermes_integration             -v
      - name: Import Hermes MCP server
        run: python -c "import aegisflow.integrations.hermes_mcp as h; print(h.mcp)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
